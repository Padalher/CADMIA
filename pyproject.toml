[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cadmia"
version = "0.3.0"
description = "CADMIA — Computational Agent-Driven Molecular Intelligence Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Daniel Alvarez Hernandez", email = "pablo.alvarez@padalher.com" }]
keywords = [
    "conceptual DFT", "Fukui functions", "adsorption",
    "heterogeneous catalysis", "nanoclusters", "ORCA", "computational chemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/Padalher/CADMIA"
Repository = "https://github.com/Padalher/CADMIA"
Changelog = "https://github.com/Padalher/CADMIA/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Two user-facing install options:
#   pip install cadmia          → recommended (core: parsing, CDFT, DB, reports)
#   pip install "cadmia[full]"  → adds optional features (figures, interactive
#                                 plots, volumetric/cube isosurfaces)
# Only dependencies actually imported by the codebase are listed.
full = [
    "matplotlib>=3.5",     # report correlation figures (report_agent)
    "plotly>=5.0",         # interactive structural plots (structure visualization)
    "scipy>=1.7",          # volumetric grid handling (cube_io)
    "scikit-image>=0.19",  # isosurface extraction (cube_io)
]
# Developer tooling (not a user install option).
dev = [
    "pytest>=6.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.scripts]
cadmia = "cadmia.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cadmia*"]

[tool.setuptools.package-data]
"cadmia.structure.core" = ["atomic_data.yaml"]
"cadmia" = ["usage_guide.txt", "usage_guide.en.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
