# ECN calculation parameters
# ECN uses no distance cutoff: every atom enters the Hoppe iteration (as in Da Silva
# 2011). The exponential decay weights distant atoms close to zero.
ecn_parameters:
  max_iterations: 100
  convergence_threshold: 1e-6
  damping_factor: 6.0
