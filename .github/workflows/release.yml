# CADMIA — Release.
# Pushing a tag vX.Y.Z (or vX.Y.ZaN) builds the sdist and wheel, publishes them as a GitHub
# Release and, once enabled, uploads them to PyPI. Alpha and beta tags become pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Release notes are this version's section of the CHANGELOG.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '/^## /{f = index($0, "[" v "]")} f' CHANGELOG.md | tail -n +2 > notes.md
          pre=$([[ "$version" =~ (a|b|rc)[0-9]+$ ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --title "CADMIA $version" --notes-file notes.md $pre

  # Off until the repository variable PUBLISH_PYPI is set to true, after registering this
  # workflow as a trusted publisher on PyPI (no token is stored in the repository).
  pypi:
    name: PyPI
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
